name = "3gpp-analyzer-worker"
main = "worker/index.ts"
compatibility_date = "2024-01-01"
workers_dev = true

# Public template. Copy to wrangler.local.toml (gitignored) and set your D1 database_id
# from the Cloudflare dashboard before running Worker / D1 commands.
[[d1_databases]]
binding = "DB"
database_name = "3gpp-sniffer-db"
database_id = "<D1_DATABASE_ID>"

[[r2_buckets]]
binding = "SPECS_BUCKET"
bucket_name = "3gpp-sniffer-specs"

[vars]
NEXT_PUBLIC_SITE_URL = "https://3gppanalyzer.com"
# API origin is configured on Vercel (NEXT_PUBLIC_API_URL), not committed here.

# Custom domain for the API (requires 3gppanalyzer.com added as a Cloudflare zone).
# After the zone is active, uncomment and redeploy:
# [[routes]]
# pattern = "api.3gppanalyzer.com"
# custom_domain = true

# Add secret: wrangler secret put ANTHROPIC_API_KEY
